<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEW MAP - GAME OF LIFE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <header>
        <nav class="arcade-nav">
            <a class="nav-logo" href="index.html">GAME OF LIFE</a>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">HOME</a>
                <a href="edit.html" class="nav-btn">NEW MAP</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="edit-container">
            <div class="edit-header">
                <h1 class="map-title">NEW MAP</h1>
            </div>

            <div class="edit-toolbar">
                <button id="btnClear" class="arcade-btn">CLEAR</button>
                <button id="btnRandom" class="arcade-btn">RANDOM</button>
                <button id="btnInvert" class="arcade-btn">INVERT</button>
                <button id="btnShare" class="arcade-btn primary" style="margin-left:auto">SHARE</button>
            </div>

            <div class="edit-grid-row">
                <div class="edit-area">
                    <canvas id="editCanvas"></canvas>
                </div>
                <div class="edit-sidebar">
                    <div class="edit-settings">
                        <h2 class="sidebar-title">SIZE</h2>
                        <div class="form-row">
                            <label for="mapWidth">W:</label>
                            <input type="number" id="mapWidth" value="30" min="3" max="160" class="arcade-input small" />
                        </div>
                        <div class="form-row">
                            <label for="mapHeight">H:</label>
                            <input type="number" id="mapHeight" value="30" min="3" max="160" class="arcade-input small" />
                        </div>
                        <button id="btnApplySize" class="arcade-btn small">APPLY</button>
                    </div>
                    <div class="edit-rules">
                        <h2 class="sidebar-title">RULES</h2>
                        <ul class="rules-list">
                            <li>Any live cell with <span class="hl">2 or 3</span> neighbors survives.</li>
                            <li>Any dead cell with exactly <span class="hl">3</span> neighbors becomes alive.</li>
                            <li>All other cells die or stay dead.</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="play-controls">
                <button id="btnPlay" class="arcade-btn primary">PLAY</button>
                <button id="btnStep" class="arcade-btn">STEP</button>
                <button id="btnReset" class="arcade-btn">RESET</button>
                <span class="generation-counter">GEN: <span id="genCount">0</span></span>
            </div>

            <div id="saveResult" class="save-result"></div>
        </div>
    </main>
    <footer class="arcade-footer">
        <span class="blink">INSERT COIN</span>
        <span>&copy; 2026 Doug Luxem</span>
        <span class="blink">PRESS START</span>
    </footer>
    <script src="js/gameoflife.js"></script>
    <script src="js/codec.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
